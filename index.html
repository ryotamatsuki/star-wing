<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>STAR WING</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { display: block; width: 100%; height: 100%; }

    #hud {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      font-family: 'Courier New', monospace;
      color: #fff;
      z-index: 5;
    }
    #score-display {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      font-size: 20px;
      text-shadow: 0 0 6px #0ff;
    }
    #stage-display {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      font-size: 20px;
      text-shadow: 0 0 6px #ff8;
    }
    #boss-hud {
      position: absolute;
      top: max(50px, calc(env(safe-area-inset-top) + 38px));
      left: 50%;
      transform: translateX(-50%);
      width: min(300px, 44vw);
      text-align: center;
      text-shadow: 0 0 6px #f80;
    }
    #boss-hud[hidden] { display: none; }
    #boss-label { font-size: 13px; letter-spacing: 1px; }
    #boss-hp-bg {
      width: 100%; height: 9px;
      margin-top: 4px;
      background: rgba(40, 20, 20, 0.9);
      border: 1px solid rgba(255, 180, 120, 0.8);
    }
    #boss-hp-bar {
      width: 100%; height: 100%;
      background: #f60;
      transition: width 0.12s linear;
    }
    #combat-alert {
      position: absolute;
      top: max(82px, calc(env(safe-area-inset-top) + 72px));
      left: 50%;
      transform: translateX(-50%) scale(0.92);
      min-width: 210px;
      text-align: center;
      font-size: clamp(15px, 2.4vw, 22px);
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 8px currentColor;
      opacity: 0;
      transition: opacity 0.08s, transform 0.08s;
    }
    #combat-alert.active {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    #charge-hud {
      position: absolute;
      left: 50%;
      bottom: max(38px, calc(env(safe-area-inset-bottom) + 36px));
      transform: translateX(-50%);
      width: min(190px, 28vw);
      min-width: 140px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      text-shadow: 0 0 7px #ffb347;
    }
    #charge-hud[hidden] { display: none; }
    #charge-label { display: block; margin-bottom: 4px; }
    #charge-bar-bg {
      width: 100%; height: 7px;
      background: rgba(40, 30, 20, 0.85);
      border: 1px solid rgba(255, 190, 110, 0.8);
    }
    #charge-bar {
      width: 0%; height: 100%;
      background: #ffb347;
      transition: width 0.08s linear, background 0.12s;
    }
    #charge-hud.ready { text-shadow: 0 0 9px #ffe477; }
    #charge-hud.ready #charge-bar { background: #ffe477; }
    #charge-hud.full {
      text-shadow: 0 0 12px #fff, 0 0 18px #ffe477;
    }
    #charge-hud.full #charge-bar { background: #fff4a8; box-shadow: 0 0 8px #ffe477; }
    #pace-feedback {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: repeating-linear-gradient(
        104deg,
        transparent 0 18px,
        rgba(150, 235, 255, 0.22) 19px,
        transparent 21px 42px
      );
      mix-blend-mode: screen;
      transition: opacity 0.2s ease;
    }
    #pace-feedback.boost {
      opacity: 0.22;
      animation: pace-lines 0.32s linear infinite;
    }
    #pace-feedback.brake { opacity: 0; }
    @keyframes pace-lines {
      from { background-position: 0 0; }
      to { background-position: 0 42px; }
    }
    #pace-hud {
      position: absolute;
      top: max(48px, calc(env(safe-area-inset-top) + 40px));
      right: max(14px, env(safe-area-inset-right));
      padding: 3px 6px;
      font-size: 11px;
      letter-spacing: 1px;
      text-shadow: 0 0 7px currentColor;
      opacity: 0.86;
    }
    #pace-hud[hidden] { display: none; }
    #pace-hud.boost { color: #8eeaff; }
    #pace-hud.brake { color: #ffe477; }
    #shield-container {
      position: absolute;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    #shield-label { font-size: 14px; }
    #shield-bar-bg {
      width: min(240px, 34vw); height: 14px;
      background: #333;
      border: 1px solid #888;
    }
    #shield-bar {
      height: 100%;
      width: 100%;
      background: #0f8;
      transition: width 0.15s, background 0.15s;
    }
    #shield-bar.danger { background: #f40; }
    #message {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 720px);
      max-height: 90vh;
      overflow: hidden;
      text-align: center;
      font-size: clamp(22px, 5vw, 36px);
      text-shadow: 0 0 12px #fff;
      white-space: pre-line;
    }
    #orientation-overlay {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: rgba(0, 0, 0, 0.92);
      color: #fff;
      text-align: center;
      font: bold clamp(20px, 6vw, 32px) 'Courier New', monospace;
      text-shadow: 0 0 10px #0ff;
      white-space: pre-line;
      pointer-events: auto;
      z-index: 30;
    }

    #touch-controls { display: none; }
    body.touch-mode #touch-controls {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      font-family: 'Courier New', monospace;
    }
    .touch-safe-area-probe {
      position: absolute;
      inset: 0;
      visibility: hidden;
      pointer-events: none;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    .touch-move-zone {
      position: absolute;
      inset: 0 auto 0 0;
      width: 58%;
      pointer-events: auto;
      touch-action: none;
    }
    .touch-stick {
      position: absolute;
      left: 0; top: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      border: 2px solid rgba(255,255,255,0.35);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
    }
    .touch-stick.is-active { opacity: 0.82; }
    .touch-knob {
      position: absolute;
      left: 50%; top: 50%;
      width: 58px; height: 58px;
      margin: -29px 0 0 -29px;
      border-radius: 50%;
      background: rgba(120,220,255,0.55);
      border: 2px solid rgba(255,255,255,0.7);
      transition: transform 0.04s linear;
    }
    .touch-btn {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.4);
      color: #fff;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      z-index: 2;
    }
    /* Keep the decorative layer inside the visible control bounds. */
    .touch-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
    }
    .touch-btn.pressed { background: rgba(120,220,255,0.5); }
    .touch-fire {
      right: max(20px, env(safe-area-inset-right));
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 90px; height: 90px;
      font-size: 18px; font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 0 8px #0ff;
    }
    .auto-fire-enabled .touch-fire {
      width: 78px; height: 78px;
      font-size: 14px;
    }
    .touch-auto {
      right: max(20px, env(safe-area-inset-right));
      bottom: calc(124px + env(safe-area-inset-bottom));
      width: 88px; height: 44px;
      border-radius: 22px;
      font-size: 12px; font-weight: bold;
      letter-spacing: 0.5px;
    }
    .touch-charge {
      right: max(20px, env(safe-area-inset-right));
      bottom: calc(178px + env(safe-area-inset-bottom));
      width: 94px; height: 54px;
      border-radius: 27px;
      font-size: 12px; font-weight: bold;
      letter-spacing: 0.5px;
      color: #ffe477;
      text-shadow: 0 0 7px #ffb347;
    }
    #touch-controls:not(.charge-available) .touch-charge {
      opacity: 0.3;
    }
    .touch-charge.charge-active {
      background: rgba(255, 179, 71, 0.45);
      border-color: rgba(255, 228, 119, 0.9);
    }
    .touch-charge.charge-full {
      background: rgba(255, 228, 119, 0.65);
      box-shadow: 0 0 12px rgba(255, 228, 119, 0.75);
    }
    .touch-pace {
      width: 72px; height: 44px;
      border-radius: 22px;
      font-size: 11px; font-weight: bold;
      letter-spacing: 0.4px;
    }
    .touch-boost {
      right: max(20px, env(safe-area-inset-right));
      bottom: calc(242px + env(safe-area-inset-bottom));
      color: #8eeaff;
      text-shadow: 0 0 7px #4ddcff;
    }
    .touch-brake {
      right: calc(102px + env(safe-area-inset-right));
      bottom: calc(242px + env(safe-area-inset-bottom));
      color: #ffe477;
      text-shadow: 0 0 7px #ffb347;
    }
    #touch-controls.pace-unavailable .touch-pace {
      opacity: 0.28;
      pointer-events: none;
    }
    .touch-pace.pressed {
      background: rgba(120, 220, 255, 0.5);
      border-color: rgba(255, 255, 255, 0.82);
    }
    .touch-roll {
      right: calc(122px + env(safe-area-inset-right));
      bottom: max(28px, env(safe-area-inset-bottom));
      width: 78px; height: 78px;
      font-size: 15px; font-weight: bold;
      text-shadow: 0 0 8px #ff8;
      --roll-progress: 100%;
    }
    #touch-controls.fire-start .touch-fire,
    #touch-controls.fire-return .touch-fire {
      width: 90px; height: 90px;
      font-size: 18px;
      opacity: 1;
    }
    #touch-controls.fire-passive .touch-fire {
      width: 58px; height: 58px;
      font-size: 10px;
      opacity: 0.4;
    }
    .touch-roll.roll-rolling {
      background: rgba(120, 220, 255, 0.5);
    }
    .touch-roll.roll-cooldown {
      opacity: 0.42;
      background: conic-gradient(
        rgba(120, 220, 255, 0.5) var(--roll-progress),
        rgba(255, 255, 255, 0.08) 0
      );
    }
    .touch-view {
      top: calc(38px + env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      width: 44px; height: 44px;
      padding: 0;
      border-radius: 50%;
      opacity: 0.62;
      font-size: 12px; font-weight: bold;
    }

    /* Keep the title/return action clear of the larger combat cluster. */
    #touch-controls.fire-start .touch-auto,
    #touch-controls.fire-return .touch-auto {
      bottom: calc(124px + env(safe-area-inset-bottom));
    }
    #touch-controls.fire-start .touch-charge,
    #touch-controls.fire-return .touch-charge {
      bottom: calc(178px + env(safe-area-inset-bottom));
    }
    #touch-controls.fire-start .touch-boost,
    #touch-controls.fire-start .touch-brake,
    #touch-controls.fire-return .touch-boost,
    #touch-controls.fire-return .touch-brake {
      bottom: calc(242px + env(safe-area-inset-bottom));
    }
    .touch-sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-height: 400px) {
      #touch-controls { --touch-stack-bottom: max(24px, env(safe-area-inset-bottom)); }
      #score-display, #stage-display { font-size: 17px; }
      #shield-label { font-size: 12px; }
      #shield-bar-bg { height: 12px; }
      #shield-container { bottom: calc(96px + env(safe-area-inset-bottom)); }
      .touch-fire { bottom: var(--touch-stack-bottom); width: 78px; height: 78px; }
      .auto-fire-enabled .touch-fire { width: 68px; height: 68px; }
      .touch-roll { width: 68px; height: 68px; right: calc(118px + env(safe-area-inset-right)); }
      .touch-auto { bottom: calc(var(--touch-stack-bottom) + 88px); }
      .touch-charge { bottom: calc(var(--touch-stack-bottom) + 142px); }
      .touch-boost, .touch-brake { bottom: calc(var(--touch-stack-bottom) + 206px); }
      #touch-controls.fire-start .touch-auto,
      #touch-controls.fire-return .touch-auto {
        bottom: calc(var(--touch-stack-bottom) + 100px);
      }
      #touch-controls.fire-start .touch-charge,
      #touch-controls.fire-return .touch-charge {
        bottom: calc(var(--touch-stack-bottom) + 154px);
      }
      #touch-controls.fire-start .touch-boost,
      #touch-controls.fire-start .touch-brake,
      #touch-controls.fire-return .touch-boost,
      #touch-controls.fire-return .touch-brake {
        bottom: calc(var(--touch-stack-bottom) + 218px);
      }
    }

    @media (max-height: 300px) {
      #touch-controls {
        --touch-stack-bottom: max(16px, env(safe-area-inset-bottom));
      }
      #touch-controls .touch-fire {
        width: 60px; height: 60px;
      }
      #touch-controls.fire-start .touch-fire,
      #touch-controls.fire-return .touch-fire,
      #touch-controls.fire-passive .touch-fire {
        width: 60px; height: 60px;
        font-size: 14px;
      }
      #touch-controls .touch-auto {
        width: 80px; height: 40px;
        border-radius: 20px;
        bottom: calc(var(--touch-stack-bottom) + 68px);
      }
      #touch-controls .touch-charge {
        width: 88px; height: 48px;
        border-radius: 24px;
        bottom: calc(var(--touch-stack-bottom) + 116px);
      }
      #touch-controls .touch-pace {
        width: 64px; height: 40px;
        border-radius: 20px;
      }
      #touch-controls .touch-boost,
      #touch-controls .touch-brake {
        bottom: calc(var(--touch-stack-bottom) + 172px);
      }
      #touch-controls.fire-start .touch-auto,
      #touch-controls.fire-return .touch-auto {
        bottom: calc(var(--touch-stack-bottom) + 68px);
      }
      #touch-controls.fire-start .touch-charge,
      #touch-controls.fire-return .touch-charge {
        bottom: calc(var(--touch-stack-bottom) + 116px);
      }
      #touch-controls.fire-start .touch-boost,
      #touch-controls.fire-start .touch-brake,
      #touch-controls.fire-return .touch-boost,
      #touch-controls.fire-return .touch-brake {
        bottom: calc(var(--touch-stack-bottom) + 172px);
      }
    }
    @media (orientation: portrait) {
      body.touch-mode #touch-controls { visibility: hidden; }
      body.touch-mode #orientation-overlay { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="pace-feedback"></div>
    <div id="score-display">SCORE: <span id="score">0</span></div>
    <div id="stage-display">STAGE <span id="stage">1</span></div>
    <div id="pace-hud" hidden aria-live="polite"><span id="pace-label"></span></div>
    <div id="boss-hud" hidden>
      <div id="boss-label">BOSS</div>
      <div id="boss-hp-bg"><div id="boss-hp-bar"></div></div>
    </div>
    <div id="combat-alert" aria-live="polite"></div>
    <div id="charge-hud" hidden aria-live="polite">
      <span id="charge-label">CHARGE</span>
      <div id="charge-bar-bg"><div id="charge-bar"></div></div>
    </div>
    <div id="shield-container">
      <span id="shield-label">SHIELD</span>
      <div id="shield-bar-bg"><div id="shield-bar"></div></div>
    </div>
    <div id="message"></div>
  </div>
  <div id="orientation-overlay">端末を横向きにしてください</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
