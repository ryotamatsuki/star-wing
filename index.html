<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>STAR WING</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      position: fixed;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { display: block; width: 100%; height: 100%; }

    #hud {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      font-family: 'Courier New', monospace;
      color: #fff;
      z-index: 5;
    }
    #score-display {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      font-size: 20px;
      text-shadow: 0 0 6px #0ff;
    }
    #stage-display {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      font-size: 20px;
      text-shadow: 0 0 6px #ff8;
    }
    #shield-container {
      position: absolute;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    #shield-label { font-size: 14px; }
    #shield-bar-bg {
      width: min(240px, 34vw); height: 14px;
      background: #333;
      border: 1px solid #888;
    }
    #shield-bar {
      height: 100%;
      width: 100%;
      background: #0f8;
      transition: width 0.15s, background 0.15s;
    }
    #shield-bar.danger { background: #f40; }
    #message {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 720px);
      max-height: 90vh;
      overflow: hidden;
      text-align: center;
      font-size: clamp(22px, 5vw, 36px);
      text-shadow: 0 0 12px #fff;
      white-space: pre-line;
    }

    #touch-controls { display: none; }
    body.touch-mode #touch-controls {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      font-family: 'Courier New', monospace;
    }
    .touch-move-zone {
      position: absolute;
      inset: 0 auto 0 0;
      width: 58%;
      pointer-events: auto;
      touch-action: none;
    }
    .touch-stick {
      position: absolute;
      left: 0; top: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.10);
      border: 2px solid rgba(255,255,255,0.35);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
    }
    .touch-stick.is-active { opacity: 0.82; }
    .touch-knob {
      position: absolute;
      left: 50%; top: 50%;
      width: 58px; height: 58px;
      margin: -29px 0 0 -29px;
      border-radius: 50%;
      background: rgba(120,220,255,0.55);
      border: 2px solid rgba(255,255,255,0.7);
      transition: transform 0.04s linear;
    }
    .touch-btn {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.4);
      color: #fff;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      z-index: 2;
    }
    /* The hit area is deliberately larger than the visible control. */
    .touch-btn::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: inherit;
    }
    .touch-btn.pressed { background: rgba(120,220,255,0.5); }
    .touch-fire {
      right: max(20px, env(safe-area-inset-right));
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 90px; height: 90px;
      font-size: 18px; font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 0 8px #0ff;
    }
    .auto-fire-enabled .touch-fire {
      width: 78px; height: 78px;
      font-size: 14px;
    }
    .touch-auto {
      right: max(20px, env(safe-area-inset-right));
      bottom: calc(116px + env(safe-area-inset-bottom));
      width: 78px; height: 30px;
      border-radius: 15px;
      font-size: 11px; font-weight: bold;
      letter-spacing: 0.5px;
    }
    .touch-roll {
      right: calc(116px + env(safe-area-inset-right));
      bottom: max(28px, env(safe-area-inset-bottom));
      width: 78px; height: 78px;
      font-size: 15px; font-weight: bold;
      text-shadow: 0 0 8px #ff8;
    }
    .touch-view {
      top: calc(42px + env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      width: 32px; height: 32px;
      padding: 0;
      border-radius: 50%;
      opacity: 0.62;
      font-size: 12px; font-weight: bold;
    }

    @media (max-height: 400px) {
      #score-display, #stage-display { font-size: 17px; }
      #shield-label { font-size: 12px; }
      #shield-bar-bg { height: 12px; }
      #shield-container { bottom: calc(96px + env(safe-area-inset-bottom)); }
      .touch-fire { width: 78px; height: 78px; }
      .auto-fire-enabled .touch-fire { width: 68px; height: 68px; }
      .touch-roll { width: 68px; height: 68px; right: calc(102px + env(safe-area-inset-right)); }
      .touch-auto { bottom: calc(102px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="score-display">SCORE: <span id="score">0</span></div>
    <div id="stage-display">STAGE <span id="stage">1</span></div>
    <div id="shield-container">
      <span id="shield-label">SHIELD</span>
      <div id="shield-bar-bg"><div id="shield-bar"></div></div>
    </div>
    <div id="message"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
